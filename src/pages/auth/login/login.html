<body>

            <h1>FOOD STORE</h1>

            <label for="email">Email:</label>

            <label for="password">Contraseña:</label>

            <p class="registro">¿No tenés cuenta? <a href="../registro/registro.html">Registrate acá</a></p>
        </form>
